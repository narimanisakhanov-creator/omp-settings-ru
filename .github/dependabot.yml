version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The repository keeps exactly one public branch, so Dependabot must not create
    # `dependabot/*` branches. Update the pinned action SHAs by hand instead.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
