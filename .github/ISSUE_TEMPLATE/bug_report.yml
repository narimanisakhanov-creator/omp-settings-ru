name: ошибка
description: Воспроизводимая ошибка перевода или поведения /settings
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: Не прикладывайте ключи, сессии и личные конфиги. Укажите фактические версии OMP и плагина; совместимость описана в README.
  - type: input
    id: versions
    attributes:
      label: Версии плагина и OMP
      placeholder: omp-settings-ru <версия>, omp <версия>
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: ОС и терминал
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Минимальные шаги, ожидаемый и фактический результат; ID настройки, если известен.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Очищенный вывод или снимок
      description: Без ключей, личных путей и содержимого сессий.
