name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate tag version
        shell: bash
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          package_version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package.json version $package_version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: host-version
        shell: bash
        run: echo "version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).devDependencies["@oh-my-pi/pi-coding-agent"])')" >> "$GITHUB_OUTPUT"
      - name: Prepare exact native updater host
        id: updater-host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_VERSION: ${{ steps.host-version.outputs.version }}
        run: bun scripts/ci/prepare-host.ts "$HOST_VERSION" linux
      - run: bun run check
        env:
          OMP_UPDATER_EXECUTABLE: ${{ steps.updater-host.outputs.executable }}
          OMP_UPDATER_HOST_VERSION: ${{ steps.host-version.outputs.version }}
      - id: pack
        shell: bash
        run: |
          archive=$(npm pack --silent)
          sha256sum "$archive" > SHA256SUMS
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(bun -e 'const v=process.argv.at(-1); const s=await Bun.file("CHANGELOG.md").text(); const escaped=v.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&"); const re=new RegExp(`^##\\s+(?:\\[)?${escaped}(?:\\])?(?:\\([^\\n]*\\))?[^\\n]*\\n[\\s\\S]*?(?=\\n##\\s|(?![\\s\\S]))`,"m"); process.stdout.write(s.match(re)?.[0]?.trim() ?? "")' "$version")
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.archive }}" SHA256SUMS --title "$GITHUB_REF_NAME" --notes "$notes"
      - name: Move stable channel
        shell: bash
        run: |
          git fetch origin refs/heads/stable
          stable_sha=$(git rev-parse FETCH_HEAD)
          release_sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if ! git merge-base --is-ancestor "$stable_sha" "$release_sha"; then
            echo "Refusing to move stable backwards or across unrelated history" >&2
            exit 1
          fi
          git push origin "$release_sha":refs/heads/stable
