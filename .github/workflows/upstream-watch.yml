name: upstream-watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: OMP version to upgrade to
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version=$(curl -fsSL https://registry.npmjs.org/@oh-my-pi%2Fpi-coding-agent | jq -er '."dist-tags".latest')
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid upstream version: $version" >&2
            exit 1
          fi
          branch="upgrade/omp-$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          existing_pr=$(gh pr list --head "$GITHUB_REPOSITORY_OWNER:$branch" --state all --json number --jq 'length > 0')
          if [ "$existing_pr" = true ]; then
            printf 'mode=skip\n' >> "$GITHUB_OUTPUT"
            echo "$branch already has a PR; leaving its branch and body untouched"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            printf 'mode=recover\n' >> "$GITHUB_OUTPUT"
            echo "$branch exists without a PR; will create a PR from its existing report without updating the branch"
            exit 0
          fi
          pinned=$(jq -r '.peerDependencies["@oh-my-pi/pi-coding-agent"]' package.json)
          if [ "$version" = "$pinned" ]; then
            printf 'mode=skip\n' >> "$GITHUB_OUTPUT"
            echo "Already pinned at $pinned"
            exit 0
          fi
          printf 'mode=new\n' >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.mode == 'new'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          bun install --ignore-scripts
          bun scripts/upgrade-host.ts "$VERSION"
          set +e
          bun run check > check-output.txt 2>&1
          status=$?
          set -e
          echo "check exit status: $status" >> check-output.txt
          if [ "$status" -ne 0 ]; then echo "::warning::bun run check exited $status; review attached check-output.txt; this report does not claim check success"; fi
      - if: steps.version.outputs.mode == 'new'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: upgrade-prepared
          path: |
            package.json
            bun.lock
            baseline/${{ steps.version.outputs.version }}-linux.json
            upgrade-report.md
            check-output.txt
  baseline:
    needs: prepare
    if: needs.prepare.outputs.mode == 'new'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: win32
          - os: macos-14
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-prepared
      - run: bun install --ignore-scripts
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: bun run source:export "baseline/$VERSION-$PLATFORM.json"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: baseline-${{ matrix.platform }}
          path: baseline/${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.json
  publish:
    needs: [prepare, baseline]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.mode == 'recover' || (needs.prepare.outputs.mode == 'new' && needs.baseline.result == 'success'))
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: needs.prepare.outputs.mode == 'new'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-prepared
      - if: needs.prepare.outputs.mode == 'new'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: baseline-*
          merge-multiple: true
          path: baseline
      - id: publish-branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MODE: ${{ needs.prepare.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          branch="upgrade/omp-$VERSION"
          existing_pr=$(gh pr list --head "$GITHUB_REPOSITORY_OWNER:$branch" --state all --json number --jq 'length > 0')
          if [ "$existing_pr" = true ]; then
            echo "$branch already has a PR; leaving its branch and body untouched"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "$branch already exists; preserving it without a push"
          elif [ "$MODE" = recover ]; then
            echo "$branch disappeared before PR recovery" >&2
            exit 1
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "$branch"
            git add package.json bun.lock baseline
            git add -f upgrade-report.md check-output.txt
            git commit -m "upgrade: OMP $VERSION"
            git push origin "HEAD:refs/heads/$branch"
          fi
      - if: steps.publish-branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="upgrade/omp-$VERSION"
          existing_pr=$(gh pr list --head "$GITHUB_REPOSITORY_OWNER:$branch" --state all --json number --jq 'length > 0')
          if [ "$existing_pr" = true ]; then
            echo "$branch acquired a PR; leaving it untouched"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$branch"
          notes="$(git show FETCH_HEAD:upgrade-report.md; printf '\n\n### Check output (tail)\n'; git show FETCH_HEAD:check-output.txt | tail -n 80)"
          gh pr create --title "upgrade: OMP $VERSION" --body "$notes" --base main --head "$branch"
