name: upstream-watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: OMP version to upgrade to
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - id: version
        shell: bash
        run: |
          v='${{ inputs.version }}'
          [ -n "$v" ] || v=$(curl -fsSL https://registry.npmjs.org/@oh-my-pi%2Fpi-coding-agent | jq -r '."dist-tags".latest')
          pinned=$(jq -r '.peerDependencies["@oh-my-pi/pi-coding-agent"]' package.json)
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
          if [ "$v" = "$pinned" ]; then printf 'changed=false\n' >> "$GITHUB_OUTPUT"; echo "Already pinned at $pinned"; exit 0; fi
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          bun install --ignore-scripts
          bun scripts/upgrade-host.ts '${{ steps.version.outputs.version }}'
          set +e
          bun run check > check-output.txt 2>&1
          status=$?
          set -e
          echo "check exit status: $status" >> check-output.txt
      - if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: upgrade-prepared
          path: |
            package.json
            bun.lock
            baseline/${{ steps.version.outputs.version }}-linux.json
            upgrade-report.md
            check-output.txt
  baseline:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: win32
          - os: macos-14
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-prepared
      - run: bun install --ignore-scripts
      - run: bun run source:export baseline/${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: baseline-${{ matrix.platform }}
          path: baseline/${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.json
  publish:
    needs: [prepare, baseline]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: baseline-*
          merge-multiple: true
          path: baseline
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B upgrade/omp-${{ needs.prepare.outputs.version }}
          git add package.json bun.lock baseline
          git add -f upgrade-report.md check-output.txt
          git commit -m "upgrade: OMP ${{ needs.prepare.outputs.version }}"
          git push --force origin HEAD:refs/heads/upgrade/omp-${{ needs.prepare.outputs.version }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          notes="$(cat upgrade-report.md; printf '\n\n### Check output (tail)\n'; tail -n 80 check-output.txt)"
          gh pr create --title "upgrade: OMP ${{ needs.prepare.outputs.version }}" --body "$notes" --base main --head upgrade/omp-${{ needs.prepare.outputs.version }} || gh pr edit upgrade/omp-${{ needs.prepare.outputs.version }} --body "$notes"
