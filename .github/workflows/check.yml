# Package/domain source matrix is separate from installed-host panel evidence.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      hosts: ${{ steps.hosts.outputs.matrix }}
    steps:
      # Enumerate the same reviewed source head the check jobs and receipts bind.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: hosts
        run: echo "matrix=$(bun scripts/check-matrix.ts --ci-matrix)" >> "$GITHUB_OUTPUT"
  check:
    needs: matrix
    name: check (${{ matrix.os }}, ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      # The receipt must bind the reviewed source head, never the synthetic pull-request merge commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - name: Prepare exact native updater host
        id: updater-host
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/prepare-host.ts ${{ matrix.version }} ${{ matrix.platform }}
      - run: bun test
        env:
          OMP_UPDATER_EXECUTABLE: ${{ steps.updater-host.outputs.executable }}
          OMP_UPDATER_HOST_VERSION: ${{ matrix.version }}
      - run: bun scripts/check-coverage.ts ${{ matrix.version }} ${{ matrix.platform }}
      - run: bun scripts/diff-upstream.ts ${{ matrix.version }} ${{ matrix.platform }}
      - run: bun run smoke
      - run: bun run smoke:panel
      - run: bun run release:check
      - name: Exercise fixed native installed host
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OMP_WORKFLOW_HEAD: ${{ github.sha }}
          OMP_CHECK_NAME: check (${{ matrix.os }}, ${{ matrix.version }})
        run: bun scripts/smoke-ci-host.ts ${{ matrix.version }}
      # The reviewed source itself, not an already published release: a real native
      # marketplace clone of the working tree must load the translation.
      - name: Exercise reviewed source through the native marketplace channel
        run: bun scripts/distribution-smoke.ts --source --executable "${{ steps.updater-host.outputs.executable }}"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: installed-smoke-${{ matrix.version }}-${{ matrix.platform }}
          path: installed-smoke-${{ matrix.version }}-${{ matrix.platform }}.json

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: check markdown links
        run: npx --yes markdown-link-check@3.13.7 --config .github/markdown-link-check.json README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md docs/faq.md docs/glossary.md docs/architecture.md
      - name: scan for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2.13.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
