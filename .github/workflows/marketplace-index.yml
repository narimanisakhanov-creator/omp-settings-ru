name: marketplace-index
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z) to promote
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-index
  cancel-in-progress: false
jobs:
  # Read-only proof. It proves the successful release run for the exact tag commit and the
  # artifact that run uploaded, downloads and re-hashes every asset from that artifact,
  # prepares the native host for the tag's own package version, and exercises the proven
  # catalog through the real distribution smoke. Only a sealed receipt produced after that
  # smoke may leave this job, and no write-capable secret ever exists here.
  prepublish:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Resolve and validate the release tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # distribution-session imports the native PTY module; without the locked graph Bun
      # auto-installs pi-natives into the smoke home and falls back to a source build.
      - name: Install the locked dependency graph
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      # Proves the successful release run at the dereferenced tag commit, the draft job of the
      # run's current attempt, and the one artifact that run uploaded (selected by the build
      # attempt embedded in its name, whose verify job is proven too). Read-only token only:
      # this job also runs the released tag's native smoke, so no write-capable secret exists.
      - name: Prove the release artifact source against the exact tag commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bun scripts/release-actions.ts prepublish-source \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --checkout "$GITHUB_WORKSPACE"
      # A draft release is invisible to this token by design, so the run-bound artifact the
      # read-only release `verify` job uploaded is the evidence instead.
      - name: Download the proven run's release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.source.outputs.release-run-id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact-name }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-draft"
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/release-draft"
      # Artifact-bound prepublication proof: the manifest is bound to the repository, tag,
      # commit, run and attempt, every asset byte is re-hashed, the archive must equal
      # SHA256SUMS, and the catalog comes from those exact bytes.
      - name: Prove the draft release from the release artifact
        id: prepublish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_RUN_ID: ${{ steps.source.outputs.release-run-id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.source.outputs.release-run-attempt }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact-name }}
        run: |
          set -euo pipefail
          bun scripts/release-actions.ts prepublish \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --checkout "$GITHUB_WORKSPACE" \
            --assets "$RUNNER_TEMP/release-draft" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --output "$RUNNER_TEMP/prepublish" \
            --timeout-ms 1800000
      # The host version comes from the tag commit's package.json as proven by the source
      # step, never from moving main. The same value is sealed into the receipt.
      - name: Prepare the exact native host
        id: native-host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ steps.source.outputs.host-version }}
        run: bun scripts/ci/prepare-host.ts "$HOST_VERSION" linux
      # The proven draft catalog is installed by a real native host before latest moves: this is
      # the approved prepublication gate, not a build of the working tree. Host peers are
      # optional, so the plugin payload carries no registry-resolved host copy.
      - name: Exercise the draft catalog through the native distribution smoke
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/distribution-smoke.ts \
            --executable "${{ steps.native-host.outputs.executable }}" \
            --catalog "${{ steps.prepublish.outputs.catalog }}" \
            --home "$RUNNER_TEMP/smoke-home" \
            | tee "$RUNNER_TEMP/prepublish/smoke.json"
      # A failing native smoke must say who asked for the dependency graph it could not load:
      # the profile's shared plugins lock is the installer's own resolution, not ours.
      - name: Capture the installer dependency graph on smoke failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepublish/graph"
          find "$RUNNER_TEMP/smoke-home" -maxdepth 6 \
            \( -name package.json -o -name bun.lock \) -path "*plugins*" \
            -exec cp --parents {} "$RUNNER_TEMP/prepublish/graph" \; || true
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        if: failure()
        with:
          name: prepublish-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepublish
          if-no-files-found: warn
          retention-days: 7
      # The receipt is written only after the smoke step succeeded and only for the exact
      # catalog bytes that were proven above.
      - name: Seal the prepublication receipt
        shell: bash
        run: bun scripts/release-actions.ts seal --dir "$RUNNER_TEMP/prepublish" --smoke-json "$RUNNER_TEMP/prepublish/smoke.json"
      # A rerun of only the promote job keeps this name; the artifact is never re-addressed
      # by the rerun's incremented attempt.
      - id: artifact
        shell: bash
        run: echo "name=prepublish-${{ steps.tag.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/prepublish/receipt.json
          if-no-files-found: error
          retention-days: 7
  # Privileged promotion on a fresh runner. It executes only trusted-main scripts, verifies
  # the prepublish artifact by immutable id and run origin, then calls the existing
  # marketplace-index publisher. No host, candidate or release code runs in this job.
  promote:
    needs: prepublish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepublish.outputs.artifact-name }}
          path: ${{ runner.temp }}/prepublish
          merge-multiple: true
      - name: Verify provenance and the sealed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
          ARTIFACT_ID: ${{ needs.prepublish.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.prepublish.outputs.artifact-name }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-actions.ts verify-promotion \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/prepublish/receipt.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --checkout "$GITHUB_WORKSPACE"
      # The only publisher. It re-downloads and re-hashes every draft asset itself, so the
      # verification above cannot substitute a local file for the uploaded bytes.
      - name: Promote the verified draft through the existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
        run: bun scripts/marketplace-index.ts --tag "$TAG" --timeout-ms 1800000
      # A successful promote is not the proof: the public latest channel must serve exactly
      # this tag's catalog bytes.
      - name: Prove the served latest catalog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
        run: bun scripts/release-actions.ts prove-served --tag "$TAG" --repository "$GITHUB_REPOSITORY"
