name: marketplace-index
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z) to promote
        required: true
        type: string
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: marketplace-index
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      # The draft release already carries its catalog; this job proves it, then promotes it.
      # The publisher waits for the tag-commit check run instead of querying once, re-downloads
      # every draft asset through the authenticated API, and refuses a downgrade or a conflict.
      - name: Promote the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          bun scripts/marketplace-index.ts --tag "$tag" --timeout-ms 1800000
      - name: Resolve promoted release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$RELEASE_TAG}"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')
          if [ "$type" = "tag" ]; then sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha'); fi
          check_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" \
            --jq "[.workflow_runs[] | select(.path == \".github/workflows/check.yml\" and .conclusion == \"success\")] | sort_by(.id) | last | .id // empty")
          if [ -z "${check_run}" ]; then
            echo "No successful check run for ${sha}" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "check_run=$check_run" >> "$GITHUB_OUTPUT"
      # The exercised native host is the same reviewed pin the release itself ran with.
      - name: Resolve reviewed native host version
        id: host-version
        shell: bash
        run: echo "version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).devDependencies["@oh-my-pi/pi-coding-agent"])')" >> "$GITHUB_OUTPUT"
      - name: Prove the promoted release and validate the served catalog asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHECK_RUN: ${{ steps.release.outputs.check_run }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern marketplace.json --dir "$RUNNER_TEMP"
          bun scripts/marketplace-catalog.ts --validate --tag "$RELEASE_TAG" --check-run "$CHECK_RUN" --catalog "$RUNNER_TEMP/marketplace.json"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare native host
        id: native-host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ steps.host-version.outputs.version }}
        run: bun scripts/ci/prepare-host.ts "$HOST_VERSION" linux
      - name: Exercise the promoted release through both native channels
        run: bun scripts/distribution-smoke.ts --executable "${{ steps.native-host.outputs.executable }}" --catalog "$RUNNER_TEMP/marketplace.json"
