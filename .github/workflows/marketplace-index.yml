name: marketplace-index
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z) to promote
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-index
  cancel-in-progress: false
jobs:
  # Read-only proof. It resolves the successful release run for the exact tag commit,
  # downloads and re-hashes every draft asset, prepares the native host for the tag's own
  # package version, and exercises the draft catalog through the real distribution smoke.
  # Only a sealed receipt produced after that smoke may leave this job.
  prepublish:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Resolve and validate the release tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # Proves the successful release run, the dereferenced tag commit, the exact check run
      # and every asset digest. Nothing is promoted here; there is no write token.
      - name: Prove the draft release against the exact tag commit
        id: prepublish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-actions.ts prepublish \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --checkout "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/prepublish" \
            --timeout-ms 1800000
      # The host version is read from the tag commit's package.json, never from moving main.
      - name: Prepare the exact native host
        id: native-host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ steps.prepublish.outputs.host-version }}
        run: bun scripts/ci/prepare-host.ts "$HOST_VERSION" linux
      # The draft catalog points at the already public tag/commit, so the real release can be
      # installed before latest is moved. A failure blocks promotion.
      - name: Exercise the draft catalog through the native distribution smoke
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/distribution-smoke.ts \
            --executable "${{ steps.native-host.outputs.executable }}" \
            --catalog "${{ steps.prepublish.outputs.catalog }}" \
            | tee "$RUNNER_TEMP/prepublish/smoke.json"
      # The receipt is written only after the smoke step succeeded and only for the exact
      # catalog bytes that were proven above.
      - name: Seal the prepublication receipt
        shell: bash
        run: bun scripts/release-actions.ts seal --dir "$RUNNER_TEMP/prepublish" --smoke-json "$RUNNER_TEMP/prepublish/smoke.json"
      # A rerun of only the promote job keeps this name; the artifact is never re-addressed
      # by the rerun's incremented attempt.
      - id: artifact
        shell: bash
        run: echo "name=prepublish-${{ steps.tag.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/prepublish/receipt.json
          if-no-files-found: error
          retention-days: 7
  # Privileged promotion on a fresh runner. It executes only trusted-main scripts, verifies
  # the prepublish artifact by immutable id and run origin, then calls the existing
  # marketplace-index publisher. No host, candidate or release code runs in this job.
  promote:
    needs: prepublish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepublish.outputs.artifact-id }}
          path: ${{ runner.temp }}/prepublish
      - name: Verify provenance and the sealed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
          ARTIFACT_ID: ${{ needs.prepublish.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.prepublish.outputs.artifact-name }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-actions.ts verify-promotion \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/prepublish/receipt.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --checkout "$GITHUB_WORKSPACE"
      # The only publisher. It re-downloads and re-hashes every draft asset itself, so the
      # verification above cannot substitute a local file for the uploaded bytes.
      - name: Promote the verified draft through the existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
        run: bun scripts/marketplace-index.ts --tag "$TAG" --timeout-ms 1800000
      # A successful promote is not the proof: the public latest channel must serve exactly
      # this tag's catalog bytes.
      - name: Prove the served latest catalog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepublish.outputs.tag }}
        run: bun scripts/release-actions.ts prove-served --tag "$TAG" --repository "$GITHUB_REPOSITORY"
